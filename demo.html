<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Branch ISP Info (demo)</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #14181f; --muted: #5d6675; --line: #dfe3ea;
    --accent: #1b5fd1; --accent-text: #fff; --err: #b3261e;
    --ok: #1e7a45; --warn: #9a5b00; --bad: #8a8f99;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141a; --panel: #1a1f28; --text: #e8ebf0; --muted: #98a2b3; --line: #2b3240;
            --accent: #6aa0ff; --accent-text: #0b1220; --err: #ff8a80; --ok: #5fd08d; --warn: #f0b35a; --bad: #7b8494; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size: 1.15rem; margin: 0; }
  .muted { color: var(--muted); }
  .err { color: var(--err); }
  button, select, input[type=search] { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 600; }
  .center { min-height: 60vh; display: grid; place-content: center; text-align: center; gap: 12px; padding: 24px; }
  .box { max-width: 460px; margin: 10vh auto 0; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar h1 { flex: 1 1 auto; }
  .bar button { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .who-am-i { color: var(--muted); font-size: .85rem; }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; }
  .filters input[type=search] { flex: 1 1 280px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .filters select { padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); max-width: 100%; }
  .filters label { white-space: nowrap; font-size: .9rem; }
  .count { margin-left: auto; color: var(--muted); font-size: .9rem; }

  .colhead, .head { display: grid; grid-template-columns: minmax(150px, 1.5fr) 1fr 1.2fr 1fr 1fr 84px; gap: 12px; align-items: center; }
  .colhead { padding: 6px 28px; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .list { padding: 0 16px 40px; display: grid; gap: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .head { width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px; }
  .head:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .head:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .name { display: grid; }
  .name small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head span { min-width: 0; overflow-wrap: anywhere; }
  .badge { justify-self: start; font-size: .75rem; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; color: var(--muted); }
  .s-new { color: var(--ok); } .s-original { color: var(--ok); } .s-dc { color: var(--accent); }
  .s-offnet { color: var(--warn); } .s-closed { color: var(--bad); }

  .detail { padding: 4px 16px 16px; border-top: 1px solid var(--line); }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; margin: 12px 0; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .isp h4 { margin: 0 0 6px; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  dl { margin: 0; }
  dt { color: var(--muted); font-size: .8rem; }
  dd { margin: 0 0 6px; overflow-wrap: anywhere; }
  .meta dt, .meta dd { margin: 0; font-size: .9rem; }
  a { color: var(--accent); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }

  @media (max-width: 820px) {
    .colhead { display: none; }
    .head { grid-template-columns: 1fr auto; row-gap: 2px; }
    .head .badge { grid-column: 2; grid-row: 1; }
    .head .name { grid-column: 1; grid-row: 1; }
    .head .loc, .head .isp-sum, .head .who { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); }
    .head .isp-sum::before, .head .who::before { content: attr(data-l) ": "; color: var(--muted); opacity: .8; }
    .count { margin-left: 0; }
  }

  .filters button, .foot button, .actions button, .form .link { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; font-size: .85rem; }
  dialog.modal { width: min(920px, 96vw); max-height: 92vh; overflow: auto; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); }
  dialog.modal::backdrop { background: rgba(0,0,0,.55); }
  .form { padding: 16px 20px 20px; display: grid; gap: 14px; }
  .form h2 { margin: 0; font-size: 1.1rem; }
  .form fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 14px; margin: 0; min-width: 0; }
  .form legend { padding: 0 6px; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 14px; }
  .fld { display: grid; gap: 3px; font-size: .8rem; color: var(--muted); }
  .fld input, .fld select, .fld textarea, .crow input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
  .crow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
  .form .link { border: 0; color: var(--accent); padding: 4px 6px; }
  .actions { display: flex; justify-content: flex-end; gap: 10px; }
  .actions .primary { border: 0; padding: 8px 18px; }
  @media (max-width: 820px) { .crow { grid-template-columns: 1fr; } }
</style>
<style>
  .demo-banner { background: #ffd54a; color: #1a1400; padding: 8px 16px; font-weight: 600; text-align: center; font-size: .9rem; }
</style>
</head>
<body>
<div class="demo-banner">DEMO: made-up sample data, no login, no database. Not the real site.</div>
<div id="root"></div>
<script src="demo.js"></script>
</body>
</html>
